name: macOS build

on:
  push:
    branches:
      - 'ci/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  build:
    name: Build unsigned app
    runs-on: macos-26
    timeout-minutes: 340
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Report disk space before cleanup
        run: df -h /

      - name: Free disk space
        run: |
          set -eu
          ACTIVE_XCODE="$(readlink -f /Applications/Xcode.app)"
          for XCODE_APP in /Applications/Xcode_*.app; do
            if [ -d "$XCODE_APP" ] && [ "$(readlink -f "$XCODE_APP")" != "$ACTIVE_XCODE" ]; then
              sudo rm -rf "$XCODE_APP"
            fi
          done
          xcrun simctl delete all || true
          rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" || true
          df -h /

      - name: Select Xcode
        run: |
          set -eu
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Install Homebrew build tools
        run: |
          set -eu
          # openssl@1.1 is no longer published by Homebrew, so it is not installed.
          brew install cmake ninja meson nasm yasm zlib autoconf libtool automake pkgconf
          cmake --version
          ninja --version
          meson --version

      - name: Install Rosetta 2
        run: |
          set -eu
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Check out submodules
        run: |
          set -eu
          sh scripts/ci-submodules.sh

      - name: Check out Centrifugo Swift SDK
        run: |
          set -eu
          # ImpulseTransport resolves ImpulseM.Centrifugo.Client.Swift as a sibling of the repository checkout.
          SDK_DIR="$(dirname "$GITHUB_WORKSPACE")/ImpulseM.Centrifugo.Client.Swift"
          if [ ! -f "$SDK_DIR/Package.swift" ]; then
            git clone --depth 1 https://github.com/Impulse-m/ImpulseM.Centrifugo.Client.Swift.git "$SDK_DIR"
          fi

      - name: Check brand strings
        run: |
          set -eu
          python3 -I -m unittest discover -s tools/brand_check -p "test_*.py"
          python3 -I tools/brand_check/check_strings.py Telegram-Mac/en.lproj/Localizable.strings

      - name: Test ImpulseTransport and ApiCredentials packages
        timeout-minutes: 60
        run: |
          set -o pipefail
          mkdir -p build-logs
          swift --version
          IMPULSE_TRANSPORT_DIR="submodules/telegram-ios/submodules/ImpulseTransport"
          swift build --build-tests --package-path "$IMPULSE_TRANSPORT_DIR" 2>&1 | tee build-logs/swift-build-impulse-transport.log
          CLASSES_FILE="build-logs/impulse-transport-classes.txt"
          swift test --skip-build --list-tests --package-path "$IMPULSE_TRANSPORT_DIR" | sed -n 's|^ImpulseTransportTests\.\([^/]*\)/.*|\1|p' | sort -u > "$CLASSES_FILE"
          if [ ! -s "$CLASSES_FILE" ]; then
            echo "::error::No ImpulseTransport test classes were listed"
            exit 1
          fi
          PASSED_CLASSES=""
          FAILED_CLASSES=""
          TIMED_OUT_CLASSES=""
          for CLASS in $(cat "$CLASSES_FILE"); do
            echo "Running ImpulseTransport test class ${CLASS}"
            CLASS_STATUS=0
            (
              NSUnbufferedIO=YES perl -e 'alarm shift; exec @ARGV' 180 swift test --skip-build --package-path "$IMPULSE_TRANSPORT_DIR" --filter "ImpulseTransportTests.${CLASS}/" 2>&1 | tee "build-logs/swift-test-${CLASS}.log"
              exit "${PIPESTATUS[0]}"
            ) || CLASS_STATUS=$?
            if [ "$CLASS_STATUS" -eq 142 ]; then
              TIMED_OUT_CLASSES="$TIMED_OUT_CLASSES $CLASS"
              pkill -9 -f xctest || true
            elif [ "$CLASS_STATUS" -ne 0 ]; then
              FAILED_CLASSES="$FAILED_CLASSES $CLASS"
            else
              PASSED_CLASSES="$PASSED_CLASSES $CLASS"
            fi
          done
          echo "ImpulseTransport test summary"
          echo "Passed:"
          for NAME in $PASSED_CLASSES; do
            echo "$NAME"
          done
          echo "Failed:"
          for NAME in $FAILED_CLASSES; do
            echo "$NAME"
          done
          echo "Timed out:"
          for NAME in $TIMED_OUT_CLASSES; do
            echo "$NAME"
          done
          for NAME in $FAILED_CLASSES; do
            echo "::error::ImpulseTransport test class ${NAME} failed"
          done
          for NAME in $TIMED_OUT_CLASSES; do
            echo "::error::ImpulseTransport test class ${NAME} timed out after 180 seconds"
          done
          if [ -n "$FAILED_CLASSES" ] || [ -n "$TIMED_OUT_CLASSES" ]; then
            exit 1
          fi
          swift test --package-path packages/ApiCredentials 2>&1 | tee build-logs/swift-test-api-credentials.log

      - name: Dev-stack smoke checks
        if: ${{ vars.IMPULSEM_DEV_STACK_BASE_URL != '' }}
        timeout-minutes: 10
        env:
          IMPULSEM_DEV_STACK: '1'
          IMPULSEM_DEV_STACK_BASE_URL: ${{ vars.IMPULSEM_DEV_STACK_BASE_URL }}
          IMPULSEM_DEV_STACK_PHONE: ${{ vars.IMPULSEM_DEV_STACK_PHONE }}
        run: |
          set -o pipefail
          mkdir -p build-logs
          swift test --skip-build --package-path submodules/telegram-ios/submodules/ImpulseTransport --filter DevStack 2>&1 | tee build-logs/swift-test-dev-stack.log

      - name: Neutralise clang lifetimebound in abseil
        run: |
          set -eu
          ABSL_ATTR="submodules/tg_owt/src/third_party/abseil-cpp/absl/base/attributes.h"
          sed -i '' \
            -e 's|^#define ABSL_ATTRIBUTE_LIFETIME_BOUND \[\[clang::lifetimebound\]\]|#define ABSL_ATTRIBUTE_LIFETIME_BOUND|' \
            -e 's|^#define ABSL_ATTRIBUTE_LIFETIME_BOUND __attribute__((lifetimebound))|#define ABSL_ATTRIBUTE_LIFETIME_BOUND|' \
            "$ABSL_ATTR"

      - name: Report Rust toolchain
        run: |
          set -eu
          rustup --version || true
          cargo --version || true

      - name: Restore native framework cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            core-xprojects/*/build
            packages/WalletEngine/wallet_engineFFI.xcframework
            submodules/telegram-ios/submodules/MTProtoRustEngine/MTProtoEngineFFI.xcframework
          key: macos-native-${{ hashFiles('scripts/framework-inputs.sh', 'scripts/configure_frameworks.sh') }}-${{ github.run_id }}
          restore-keys: |
            macos-native-${{ hashFiles('scripts/framework-inputs.sh', 'scripts/configure_frameworks.sh') }}-

      - name: Build native frameworks
        run: |
          set -o pipefail
          mkdir -p build-logs
          START_SECONDS="$(date +%s)"
          sh scripts/configure_frameworks.sh 2>&1 | tee build-logs/configure-frameworks.log
          echo "configure_frameworks.sh took $(( $(date +%s) - START_SECONDS )) seconds"
          df -h /

      - name: Save native framework cache
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            core-xprojects/*/build
            packages/WalletEngine/wallet_engineFFI.xcframework
            submodules/telegram-ios/submodules/MTProtoRustEngine/MTProtoEngineFFI.xcframework
          key: macos-native-${{ hashFiles('scripts/framework-inputs.sh', 'scripts/configure_frameworks.sh') }}-${{ github.run_id }}

      - name: Build app without code signing
        run: |
          set -o pipefail
          mkdir -p build-logs
          START_SECONDS="$(date +%s)"
          xcodebuild \
            -workspace Telegram-Mac.xcworkspace \
            -scheme ImpulseM \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-logs/xcodebuild.log
          echo "xcodebuild took $(( $(date +%s) - START_SECONDS )) seconds"
          df -h /

      - name: Locate unsigned app bundle
        if: success()
        id: locate-app
        run: |
          set -eu
          PRODUCTS_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Debug"
          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "::error::Products directory not found: $PRODUCTS_DIR"
            exit 1
          fi
          # The products also hold helper bundles (Sparkle's Autoupdate.app), so take the app by its product name.
          APP_PATH="$PRODUCTS_DIR/ImpulseM.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found: $APP_PATH"
            echo "Contents of $PRODUCTS_DIR:"
            ls -1 "$PRODUCTS_DIR"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Zip unsigned app bundle
        if: success()
        run: |
          set -eu
          mkdir -p build-artifacts
          ditto -c -k --keepParent "${{ steps.locate-app.outputs.app_path }}" build-artifacts/ImpulseM-macOS-unsigned.zip

      - name: Upload unsigned app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-unsigned
          path: build-artifacts/ImpulseM-macOS-unsigned.zip
          if-no-files-found: error
          retention-days: 7

      - name: Report app entitlements
        if: success()
        run: |
          set -u
          mkdir -p build-logs
          APP_PATH="${{ steps.locate-app.outputs.app_path }}"
          # Report only: unsigned builds carry no entitlements, so this step never fails the job.
          codesign -d --entitlements :- "$APP_PATH" > build-logs/app-entitlements.plist 2>&1 || true
          cat build-logs/app-entitlements.plist

      - name: Test TelegramLinks package
        run: |
          set -o pipefail
          mkdir -p build-logs
          bash packages/TelegramLinks/Tests/run-tests.sh 2>&1 | tee build-logs/telegram-links-tests.log

      - name: Test ImpulseNetworkEngine package
        timeout-minutes: 45
        run: |
          set -o pipefail
          mkdir -p build-logs
          swift test --package-path submodules/telegram-ios/submodules/ImpulseNetworkEngine 2>&1 | tee build-logs/swift-test-impulse-network-engine.log

      - name: Test ImpulseProxy and ColorPalette packages
        timeout-minutes: 45
        run: |
          set -o pipefail
          mkdir -p build-logs
          swift test --package-path packages/ImpulseProxy 2>&1 | tee build-logs/swift-test-impulse-proxy.log
          swift test --package-path packages/ColorPalette 2>&1 | tee build-logs/swift-test-color-palette.log

      - name: Report disk space after build
        if: always()
        run: df -h /

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
